query GetUserVaultPositions($address: String!, $chainId: Int!) {
  userByAddress(address: $address, chainId: $chainId) {
    address
    vaultPositions {
      id
      vault {
        address
        name
        symbol
        chain {
          id
        }
      }
      state {
        shares
        assets
        assetsUsd
        pnl
        pnlUsd
        roe
      }
    }
    vaultV2Positions {
      id
      shares
      assets
      assetsUsd
      pnl
      pnlUsd
      roe
      vault {
        address
        name
        symbol
        chain {
          id
        }
      }
    }
  }
}

query GetUserAccountOverview($address: String!, $chainId: Int!) {
  userByAddress(address: $address, chainId: $chainId) {
    address
    state {
      vaultsAssetsUsd
      vaultV2sAssetsUsd
      marketsCollateralUsd
      marketsSupplyAssetsUsd
      marketsBorrowAssetsUsd
      marketsMarginUsd
    }
    vaultPositions {
      id
      vault {
        address
        name
        symbol
        chain {
          id
        }
      }
      state {
        shares
        assets
        assetsUsd
        pnl
        pnlUsd
        roe
      }
    }
    vaultV2Positions {
      id
      shares
      assets
      assetsUsd
      pnl
      pnlUsd
      roe
      vault {
        address
        name
        symbol
        chain {
          id
        }
      }
    }
    marketPositions {
      id
      healthFactor
      market {
        marketId
        loanAsset {
          address
          symbol
        }
        collateralAsset {
          address
          symbol
        }
      }
      state {
        supplyShares
        supplyAssets
        supplyAssetsUsd
        borrowShares
        borrowAssets
        borrowAssetsUsd
        collateral
        collateralUsd
      }
    }
  }
}
